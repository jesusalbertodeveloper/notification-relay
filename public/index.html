<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notification Receiver Node</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">
    <h1>Target Device Hub</h1>
    <button id="subBtn" style="padding: 10px 20px; font-size: 16px;">Enable Chrome Notifications</button>

    <script>
        const publicVapidKey = 'BKgNIMSOcVE232_WlLsMdq6qcQjcChJon1WZEaGSpPbHITBejFCIGkznA-HH9Y0kLfl6QZ8ioF7eY4P65LXVrXI';

        document.getElementById('subBtn').addEventListener('click', async () => {
            if (!('serviceWorker' in navigator)) return;

            const registration = await navigator.serviceWorker.register('/sw.js');
            const subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
            });

            await fetch('/api/subscribe', {
                method: 'POST',
                body: JSON.stringify(subscription),
                headers: { 'Content-Type': 'application/json' }
            });

            alert('This browser is now linked to receive notifications!');
        });

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }
    </script>
</body>
</html>
